name: Markdown Lint

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  markdownlint:
    name: Validate Markdown files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: "**/*.md"
